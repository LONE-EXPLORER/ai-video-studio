[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner Case tests
    tier3: Tier 3 Cross-Feature Combination tests
    tier4: Tier 4 Real-World Application Scenarios
    m1: Milestone 1 features
    m2: Milestone 2 features
    m3: Milestone 3 features
    m4: Milestone 4 features
    m5: Milestone 5 features
